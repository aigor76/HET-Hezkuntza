    <script>
        // Configurar fecha de hoy por defecto
        document.addEventListener('DOMContentLoaded', function() {
            const hoy = new Date().toISOString().split('T')[0];
            document.getElementById('fechaInicio').value = hoy;
        });

        // Toggle checkbox para días
        function toggleCheckbox(id) {
            const checkbox = document.getElementById(id);
            const container = checkbox.parentElement;
            
            // Cambiar el estado del checkbox
            checkbox.checked = !checkbox.checked;
            
            // Actualizar la apariencia visual
            if (checkbox.checked) {
                container.classList.add('checked');
            } else {
                container.classList.remove('checked');
            }
        }

        // Toggle checkbox para horas
        function toggleTimeCheckbox(id) {
            const checkbox = document.getElementById(id);
            const container = checkbox.parentElement;

        // Generar vista previa
        function generarVistaPrevia() {
            const datos = recogerDatos();
            
            if (!validarDatos(datos)) {
                return;
            }

            // Simular la generación de horarios
            const horariosSimulados = simularHorarios(datos);
            
            mostrarVistaPrevia(horariosSimulados);
        }

        // Crear horarios (llamar a la función de Apps Script)
        function crearHorarios() {
            const datos = recogerDatos();
            
            if (!validarDatos(datos)) {
                return;
            }

            // Protección contra doble clic
            const btnCrear = document.querySelector('.btn-primary');
            if (btnCrear.disabled) {
                return; // Si ya está procesando, no hacer nada
            }

            // Deshabilitar botón inmediatamente
            btnCrear.disabled = true;
            btnCrear.style.opacity = '0.6';
            btnCrear.style.cursor = 'not-allowed';
            btnCrear.innerHTML = '⏳ Sortzen...';

            mostrarLoading(true);

            // Llamar a la función de Apps Script
            google.script.run
                .withSuccessHandler(onHorariosCreados)
                .withFailureHandler(onError)
                .generarHorarios(
                    datos.fechaInicio,
                    datos.fechaFin,
                    datos.horasSeleccionadas,
                    datos.diasSemana,
                    datos.horasPersonalizadas
                );
        }

        // Recoger datos del formulario
        function recogerDatos() {
            const fechaInicio = document.getElementById('fechaInicio').value;
            const fechaFin = document.getElementById('fechaFin').value;
            
            // Días seleccionados
            const diasSemana = [];
            for (let i = 1; i <= 5; i++) {
                if (document.getElementById(`dia${i}`) && document.getElementById(`dia${i}`).checked) {
                    diasSemana.push(i);
                }
            }
            
            // Horas predefinidas seleccionadas
            const horasSeleccionadas = [];
            const horasIds = ['hora0830', 'hora09', 'hora0930', 'hora10', 'hora1030', 'hora1050', 'hora11', 'hora1115', 'hora1130', 'hora1145', 'hora12', 'hora1215', 'hora1230', 'hora1240', 'hora13', 'hora1310', 'hora1330', 'hora1340', 'hora14', 'hora1410', 'hora1430', 'hora15', 'hora1530', 'hora16'];
            
            horasIds.forEach(id => {
                const checkbox = document.getElementById(id);
                if (checkbox && checkbox.checked) {
                    horasSeleccionadas.push(checkbox.value);
                }
            });
            
            // Horas personalizadas
            const horasPersonalizadas = document.getElementById('horasPersonalizadas').value;
            
            return {
                fechaInicio,
                fechaFin,
                diasSemana,
                horasSeleccionadas,
                horasPersonalizadas
            };
        }

        // Validar datos
        function validarDatos(datos) {
            if (!datos.fechaInicio) {
                mostrarAlert('Mesedez, hautatu hasiera data', 'error');
                return false;
            }
            
            if (!datos.fechaFin) {
                mostrarAlert('Mesedez, hautatu amaiera data', 'error');
                return false;
            }
            
            if (new Date(datos.fechaInicio) > new Date(datos.fechaFin)) {
                mostrarAlert('Hasiera data amaiera data baino lehenagokoa izan behar da', 'error');
                return false;
            }
            
            if (datos.diasSemana.length === 0) {
                mostrarAlert('Mesedez, hautatu asteko egun bat gutxienez', 'error');
                return false;
            }
            
            if (datos.horasSeleccionadas.length === 0 && !datos.horasPersonalizadas.trim()) {
                mostrarAlert('Mesedez, hautatu ordu batzuk edo idatzi pertsonalizatuak', 'error');
                return false;
            }
            
            return true;
        }

        // Simular horarios para vista previa
        function simularHorarios(datos) {
            const horarios = [];
            const nombresDias = ['Domingo', 'Astelehena', 'Asteartea', 'Asteazkena', 'Osteguna', 'Ostirala', 'Larunbata'];
            const nombresDiasEu = ['igandea', 'astelehena', 'asteartea', 'asteazkena', 'osteguna', 'ostirala', 'larunbata'];
            const meses = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
            const mesesEu = ['Urtarrilak', 'Otsailak', 'Martxoak', 'Apirilak', 'Maiatzak', 'Ekainak', 'Uztailak', 'Abuztuak', 'Irailak', 'Urriak', 'Azaroak', 'Abenduak'];
            
            // Combinar horas
            let todasLasHoras = [...datos.horasSeleccionadas];
            if (datos.horasPersonalizadas.trim()) {
                const personalizadas = datos.horasPersonalizadas.split(',')
                    .map(h => h.trim())
                    .filter(h => h && /^\d{1,2}:\d{2}$/.test(h));
                todasLasHoras = [...todasLasHoras, ...personalizadas];
            }
            
            // Eliminar duplicados y ordenar
            todasLasHoras = [...new Set(todasLasHoras)].sort();
            
            // Generar horarios de ejemplo (solo primeros 10 para preview)
            let contador = 0;
            const fechaInicio = new Date(datos.fechaInicio);
            const fechaFin = new Date(datos.fechaFin);
            
            for (let fecha = new Date(fechaInicio); fecha <= fechaFin && contador < 10; fecha.setDate(fecha.getDate() + 1)) {
                const diaSemana = fecha.getDay();
                
                if (datos.diasSemana.includes(diaSemana)) {
                    const nombreDia = nombresDias[diaSemana];
                    const nombreDiaEu = nombresDiasEu[diaSemana];
                    const dia = fecha.getDate();
                    const mes = meses[fecha.getMonth()];
                    const mesEu = mesesEu[fecha.getMonth()];
                    
                    todasLasHoras.forEach(hora => {
                        if (contador < 10) {
                            const horario = `${nombreDia} ${dia} de ${mes} - ${hora} / ${mesEu} ${dia}, ${nombreDiaEu} - ${hora}`;
                            horarios.push(horario);
                            contador++;
                        }
                    });
                }
            }
            
            return horarios;
        }

        // Mostrar vista previa
        function mostrarVistaPrevia(horarios) {
            const preview = document.getElementById('preview');
            const previewList = document.getElementById('previewList');
            
            if (horarios.length === 0) {
                previewList.innerHTML = '<p style="text-align: center; color: #666;">Ez da hitzordurik sortuko hautaketa honekin.</p>';
            } else {
                // Calcular total de horarios que se crearían
                const datos = recogerDatos();
                let totalHorarios = 0;
                
                // Combinar todas las horas
                let todasLasHoras = [...datos.horasSeleccionadas];
                if (datos.horasPersonalizadas.trim()) {
                    const personalizadas = datos.horasPersonalizadas.split(',')
                        .map(h => h.trim())
                        .filter(h => h && /^\d{1,2}:\d{2}$/.test(h));
                    todasLasHoras = [...todasLasHoras, ...personalizadas];
                }
                todasLasHoras = [...new Set(todasLasHoras)];
                
                // Calcular días totales
                const fechaInicio = new Date(datos.fechaInicio);
                const fechaFin = new Date(datos.fechaFin);
                
                for (let fecha = new Date(fechaInicio); fecha <= fechaFin; fecha.setDate(fecha.getDate() + 1)) {
                    if (datos.diasSemana.includes(fecha.getDay())) {
                        totalHorarios += todasLasHoras.length;
                    }
                }
                
                const horariosHTML = horarios.map(horario => 
                    `<div class="preview-item">${horario}</div>`
                ).join('');
                
                previewList.innerHTML = `
                    <p style="font-weight: bold; color: #119da4; margin-bottom: 15px;">
                        📊 Guztira sortuko dira: ${totalHorarios} hitzordu
                    </p>
                    <p style="margin-bottom: 10px; font-weight: 600;">Adibideak:</p>
                    ${horariosHTML}
                    ${horarios.length === 10 ? '<div class="preview-item" style="font-style: italic; opacity: 0.7; text-align: center;">... eta gehiago</div>' : ''}
                `;
            }
            
            preview.style.display = 'block';
            preview.scrollIntoView({ behavior: 'smooth' });
        }

        // Limpiar formulario
        function limpiarFormulario() {
            // NO limpiar fechas - las dejamos como están (igual que en tu HTML actual)
            
            // Limpiar días
            for (let i = 1; i <= 5; i++) {
                const checkbox = document.getElementById(`dia${i}`);
                const container = checkbox.parentElement;
                checkbox.checked = false;
                container.classList.remove('checked');
            }
            
            // Limpiar horas
            const horasInputs = document.querySelectorAll('#horasPredefinidas input[type="checkbox"]');
            horasInputs.forEach(input => {
                const container = input.parentElement;
                input.checked = false;
                container.classList.remove('checked');
            });
            
            // Limpiar horas personalizadas
            document.getElementById('horasPersonalizadas').value = '';
            
            // Ocultar vista previa
            document.getElementById('preview').style.display = 'none';
            
            // Limpiar alerts
            document.getElementById('alertContainer').innerHTML = '';
            
            // Mostrar mensaje de confirmación (como en tu HTML)
            mostrarAlert('✅ Egun eta orduen aukerak garbitu dira', 'success');
        }

        // Mostrar loading
        function mostrarLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        // Mostrar alert
        function mostrarAlert(mensaje, tipo) {
            const alertContainer = document.getElementById('alertContainer');
            const alertClass = tipo === 'error' ? 'alert-error' : 'alert-success';
            
            alertContainer.innerHTML = `
                <div class="alert ${alertClass}">
                    ${mensaje}
                </div>
            `;
            
            // Auto-hide después de 5 segundos
            setTimeout(() => {
                alertContainer.innerHTML = '';
            }, 5000);
        }

        // Callbacks de Apps Script
        function onHorariosCreados(resultado) {
            mostrarLoading(false);
            mostrarAlert(resultado, 'success');
            
            // Rehabilitar botón después de 3 segundos (protección adicional)
            setTimeout(() => {
                const btnCrear = document.querySelector('.btn-primary');
                btnCrear.disabled = false;
                btnCrear.style.opacity = '1';
                btnCrear.style.cursor = 'pointer';
                btnCrear.innerHTML = '✅ Ordutegiak sortu';
            }, 3000);
            
            // NO cerrar automáticamente - que el profesor decida cuándo cerrar
        }

        function onError(error) {
            mostrarLoading(false);
            mostrarAlert(`Errorea: ${error.message}`, 'error');
            
            // Rehabilitar botón inmediatamente en caso de error
            const btnCrear = document.querySelector('.btn-primary');
            btnCrear.disabled = false;
            btnCrear.style.opacity = '1';
            btnCrear.style.cursor = 'pointer';
            btnCrear.innerHTML = '✅ Ordutegiak sortu';
        }

        // Cerrar modal
        function cerrarModal() {
            google.script.host.close();
        }
    </script>
</body>
</html>
